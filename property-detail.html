<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Property Details – NestFind</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg main-nav sticky-top"><div class="container"><a class="navbar-brand" href="index.html"><i class="fas fa-house-chimney-user me-2"></i>NestFind</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navMenu"><ul class="navbar-nav me-auto gap-1"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link active" href="properties.html">Properties</a></li><li class="nav-item"><a class="nav-link" href="favourites.html"><i class="fas fa-heart me-1"></i>Favourites</a></li></ul><div class="d-flex align-items-center gap-2"><button class="icon-btn" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button><div id="authNav"><a href="login.html" class="btn btn-outline-primary btn-sm me-2">Sign In</a><a href="register.html" class="btn btn-primary-custom btn-sm">Register</a></div><div id="userNav" class="d-none"><div class="dropdown"><button class="profile-pill" data-bs-toggle="dropdown"><img src="" alt="" id="navUserAvatar" class="rounded-circle" style="width:32px;height:32px"/><span id="navUserName"></span><i class="fas fa-chevron-down small"></i></button><ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="favourites.html"><i class="fas fa-heart me-2"></i>Favourites</a></li><li><hr class="dropdown-divider"/></li><li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="fas fa-right-from-bracket me-2"></i>Logout</a></li></ul></div></div></div></div></div></nav>

<div class="container py-5">
  <div id="propertyContent">
    <div class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x text-primary"></i></div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script><script src="js/auth.js"></script><script src="js/data.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const id=parseInt(new URLSearchParams(window.location.search).get('id'));
  const p=RE.properties.find(x=>x.id===id)||RE.properties[0];
  document.title=p.title+' – NestFind';
  document.getElementById('propertyContent').innerHTML=`
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item"><a href="properties.html">Properties</a></li><li class="breadcrumb-item active">${p.title}</li></ol>
    </nav>
    <div class="row g-5">
      <div class="col-lg-8">
        <!-- Gallery -->
        <div class="detail-gallery mb-4">
          <div style="background:${RE.gradients[p.gradient]};border-radius:12px 0 0 12px"><i class="fas ${RE.icons[p.icon]}" style="font-size:6rem;color:rgba(255,255,255,.5)"></i></div>
          ${[0,1,2,3].map(i=>`<div style="background:${RE.gradients[(p.gradient+i+1)%RE.gradients.length]};${i===1?'border-radius:0 12px 0 0':''}${i===3?'border-radius:0 0 12px 0':''}"><i class="fas ${RE.icons[(p.icon+i+1)%RE.icons.length]}" style="color:rgba(255,255,255,.3);font-size:2.5rem"></i></div>`).join('')}
        </div>
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
          <div>
            <span class="badge property-badge property-badge-${p.status.replace(/ /g,'-')} mb-2">${p.status}</span>
            <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-.02em">${p.title}</h1>
            <p class="text-muted"><i class="fas fa-map-marker-alt me-2 text-primary"></i>${p.location}</p>
          </div>
          <div class="text-end">
            <div style="font-size:2rem;font-weight:800;color:var(--primary)">${RE.priceLabel(p.price,p.status)}</div>
            <button class="btn btn-sm btn-outline-danger mt-1 fav-toggle-btn" onclick="toggleFav(${p.id},this)">
              <i class="fas fa-heart me-1"></i>${RE.isFav(p.id)?'Saved':'Save'}
            </button>
          </div>
        </div>
        <!-- Specs -->
        <div class="detail-specs-grid mb-4">
          ${p.bedrooms>0?`<div class="spec-item"><i class="fas fa-bed"></i><strong>${p.bedrooms}</strong><small>Bedrooms</small></div>`:''}
          ${p.bathrooms>0?`<div class="spec-item"><i class="fas fa-bath"></i><strong>${p.bathrooms}</strong><small>Bathrooms</small></div>`:''}
          <div class="spec-item"><i class="fas fa-ruler-combined"></i><strong>${p.area.toLocaleString()}</strong><small>Sq Ft</small></div>
          <div class="spec-item"><i class="fas fa-calendar"></i><strong>${p.yearBuilt||'N/A'}</strong><small>Year Built</small></div>
          ${p.parking>0?`<div class="spec-item"><i class="fas fa-car"></i><strong>${p.parking}</strong><small>Parking</small></div>`:''}
        </div>
        <!-- Description -->
        <div class="mb-4 p-4 rounded-3" style="background:var(--bg-surface);border:1px solid var(--border)">
          <h5 class="fw-bold mb-3">About This Property</h5>
          <p style="color:var(--text-secondary);line-height:1.7">${p.description}</p>
        </div>
        <!-- Amenities -->
        <div class="mb-4 p-4 rounded-3" style="background:var(--bg-surface);border:1px solid var(--border)">
          <h5 class="fw-bold mb-3">Amenities & Features</h5>
          <div>${p.amenities.map(a=>`<span class="amenity-tag"><i class="fas fa-check-circle"></i>${a}</span>`).join('')}</div>
        </div>
        <!-- Map -->
        <div class="mb-4 p-4 rounded-3" style="background:var(--bg-surface);border:1px solid var(--border)">
          <h5 class="fw-bold mb-3"><i class="fas fa-map me-2"></i>Location</h5>
          <div class="map-placeholder">
            <i class="fas fa-map-marker-alt fa-3x mb-2" style="color:var(--primary)"></i>
            <strong>${p.city}</strong>
            <span>${p.location}</span>
          </div>
        </div>
      </div>
      <!-- Sidebar -->
      <div class="col-lg-4">
        <div class="sticky-top" style="top:90px">
          <div class="p-4 rounded-3 mb-4" style="background:var(--bg-surface);border:1px solid var(--border)">
            <h5 class="fw-bold mb-3"><i class="fas fa-user-tie me-2 text-primary"></i>Contact Agent</h5>
            <div class="d-flex align-items-center gap-3 mb-3">
              <img src="https://ui-avatars.com/api/?name=Agent+Smith&background=6366f1&color=fff&size=56" class="rounded-circle" alt="Agent"/>
              <div><strong>Agent Smith</strong><br/><small class="text-muted">Senior Property Expert</small><br/><div class="stars small mt-1">⭐⭐⭐⭐⭐</div></div>
            </div>
            <form id="contactForm">
              <div class="mb-2"><input type="text" class="form-control form-control-sm" placeholder="Your Name" required/></div>
              <div class="mb-2"><input type="email" class="form-control form-control-sm" placeholder="Your Email"/></div>
              <div class="mb-2"><input type="tel" class="form-control form-control-sm" placeholder="Phone Number"/></div>
              <div class="mb-3"><textarea class="form-control form-control-sm" rows="3" placeholder="I'm interested in this property...">I'm interested in ${p.title}. Please contact me with more details.</textarea></div>
              <button type="submit" class="btn btn-primary-custom w-100 btn-sm"><i class="fas fa-paper-plane me-2"></i>Send Enquiry</button>
            </form>
          </div>
          <div class="p-3 rounded-3 text-center" style="background:var(--bg-surface-2);border:1px solid var(--border)">
            <div class="fw-bold small mb-2">Share Property</div>
            <div class="d-flex justify-content-center gap-2">
              <button class="btn btn-sm btn-outline-primary" onclick="showToast('Link copied!','success')"><i class="fas fa-link"></i></button>
              <button class="btn btn-sm btn-outline-info" onclick="showToast('Shared on Twitter! (demo)','info')"><i class="fab fa-twitter"></i></button>
              <button class="btn btn-sm btn-outline-primary" onclick="showToast('Shared on Facebook! (demo)','info')"><i class="fab fa-facebook"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('contactForm')?.addEventListener('submit',function(e){
    e.preventDefault();showToast('Enquiry sent! The agent will contact you soon.','success');this.reset();
  });
});
function toggleFav(id,btn){
  const added=RE.toggleFav(id);
  btn.innerHTML=`<i class="fas fa-heart me-1"></i>${added?'Saved':'Save'}`;
  btn.className=added?'btn btn-sm btn-danger mt-1':'btn btn-sm btn-outline-danger mt-1';
  showToast(added?'Added to favourites!':'Removed from favourites.',added?'success':'warning');
}
</script>
</body>
</html>

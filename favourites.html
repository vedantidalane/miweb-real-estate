<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>My Favourites – NestFind</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg main-nav sticky-top"><div class="container"><a class="navbar-brand" href="index.html"><i class="fas fa-house-chimney-user me-2"></i>NestFind</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navMenu"><ul class="navbar-nav me-auto gap-1"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="properties.html">Properties</a></li><li class="nav-item"><a class="nav-link active" href="favourites.html"><i class="fas fa-heart me-1"></i>Favourites</a></li></ul><div class="d-flex align-items-center gap-2"><button class="icon-btn" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button><div id="authNav"><a href="login.html" class="btn btn-outline-primary btn-sm me-2">Sign In</a><a href="register.html" class="btn btn-primary-custom btn-sm">Register</a></div><div id="userNav" class="d-none"><div class="dropdown"><button class="profile-pill" data-bs-toggle="dropdown"><img src="" alt="" id="navUserAvatar" class="rounded-circle" style="width:32px;height:32px"/><span id="navUserName"></span><i class="fas fa-chevron-down small"></i></button><ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="favourites.html"><i class="fas fa-heart me-2"></i>Favourites</a></li><li><hr class="dropdown-divider"/></li><li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="fas fa-right-from-bracket me-2"></i>Logout</a></li></ul></div></div></div></div></div></nav>
<div class="page-hero"><div class="container"><h1>My <span style="color:#fca5a5">Favourites</span></h1><p>Properties you've saved</p></div></div>
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div class="text-muted small"><span id="favCount">0</span> saved properties</div>
    <button class="btn btn-sm btn-outline-danger" id="clearFavBtn"><i class="fas fa-trash me-2"></i>Clear All</button>
  </div>
  <div class="row g-4" id="favGrid">
    <div class="col-12"><div class="fav-empty"><i class="fas fa-heart"></i><h5>No favourites yet</h5><p class="text-muted">Browse properties and click the heart icon to save them here.</p><a href="properties.html" class="btn btn-primary-custom mt-2">Browse Properties</a></div></div>
  </div>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script><script src="js/auth.js"></script><script src="js/data.js"></script>
<script>
function render(){
  const favIds=RE.getFavs();
  document.getElementById('favCount').textContent=favIds.length;
  const grid=document.getElementById('favGrid');
  if(favIds.length===0){grid.innerHTML='<div class="col-12"><div class="fav-empty"><i class="fas fa-heart"></i><h5>No favourites yet</h5><p class="text-muted">Browse properties and click the heart icon to save them.</p><a href="properties.html" class="btn btn-primary-custom mt-2">Browse Properties</a></div></div>';return;}
  const props=RE.properties.filter(p=>favIds.includes(p.id));
  grid.innerHTML=props.map(p=>`
    <div class="col-md-6 col-lg-4" id="fcard-${p.id}">
      <div class="property-card">
        <div class="property-thumb" style="background:${RE.gradients[p.gradient]}">
          <i class="fas ${RE.icons[p.icon]}"></i>
          <span class="property-badge property-badge-${p.status.replace(/ /g,'-')}">${p.status}</span>
          <button class="property-fav-btn active" onclick="removeFav(${p.id})"><i class="fas fa-heart"></i></button>
          <span class="property-price-tag">${RE.priceLabel(p.price,p.status)}</span>
        </div>
        <div class="property-body">
          <div class="property-type">${p.type}</div>
          <h6 class="property-title"><a href="property-detail.html?id=${p.id}" class="text-decoration-none">${p.title}</a></h6>
          <div class="property-location"><i class="fas fa-map-marker-alt"></i>${p.location}</div>
          <div class="property-specs">
            ${p.bedrooms>0?`<span><i class="fas fa-bed"></i>${p.bedrooms}</span>`:''}
            ${p.bathrooms>0?`<span><i class="fas fa-bath"></i>${p.bathrooms}</span>`:''}
            <span><i class="fas fa-ruler-combined"></i>${p.area.toLocaleString()} sqft</span>
          </div>
        </div>
      </div>
    </div>`).join('');
}
function removeFav(id){
  RE.toggleFav(id);showToast('Removed from favourites.','warning');render();
}
document.getElementById('clearFavBtn')?.addEventListener('click',function(){
  if(confirm('Remove all saved properties?')){RE.saveFavs([]);render();showToast('All favourites cleared.','warning');}
});
document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
